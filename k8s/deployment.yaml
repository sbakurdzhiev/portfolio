apiVersion: apps/v1
kind: Deployment
metadata:
  name: stefan-portfolio
  namespace: production
  labels:
    app.kubernetes.io/name: stefan-portfolio
    app.kubernetes.io/instance: production
    app.kubernetes.io/part-of: platform-portfolio
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stefan-portfolio
  template:
    metadata:
      labels:
        app: stefan-portfolio
    spec:
      containers:
        - name: web
          image: quay.io/sbakurdzhiev/portfolio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stefan-portfolio-svc
  namespace: production
  labels:
    app: stefan-portfolio
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: stefan-portfolio
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: stefan-portfolio-route
  namespace: production
  labels:
    app: stefan-portfolio
spec:
  to:
    kind: Service
    name: stefan-portfolio-svc
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
