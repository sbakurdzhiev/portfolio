apiVersion: apps/v1
kind: Deployment
metadata:
  name: stefan-portfolio
  namespace: production
  labels:
    app.kubernetes.io/name: stefan-portfolio
    app.kubernetes.io/instance: production
    app.kubernetes.io/part-of: platform-portfolio
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stefan-portfolio
  template:
    metadata:
      labels:
        app: stefan-portfolio
    spec:
      # Pod-level CIS benchmark security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: quay.io/sbakurdzhiev/portfolio:latest
          imagePullPolicy: IfNotPresent
          # Container-level zero-trust hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: cache-volume
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stefan-portfolio-svc
  namespace: production
  labels:
    app: stefan-portfolio
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: stefan-portfolio
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: stefan-portfolio-route
  namespace: production
  labels:
    app: stefan-portfolio
spec:
  to:
    kind: Service
    name: stefan-portfolio-svc
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Zero-Trust Kubernetes Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stefan-portfolio-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: stefan-portfolio
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from OpenShift Ingress Router / Load Balancers
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
